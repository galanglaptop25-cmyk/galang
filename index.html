<!DOCTYPE html>
<html lang="id" class="dark">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Smart Home IoT - Ultra Lightweight Mobile</title>
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = { darkMode: 'class', }
    </script>
    <!-- FontAwesome Icons -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <!-- HiveMQ MQTT Client Library -->
    <script src="https://unpkg.com/mqtt@4.3.7/dist/mqtt.min.js"></script>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@300;400;500;600;700;800&display=swap');
        body { font-family: 'Plus Jakarta Sans', sans-serif; }
        
        #particleCanvas {
            position: fixed;
            top: 0; left: 0; width: 100%; height: 100%;
            pointer-events: none;
            z-index: 0;
        }

        @keyframes breathingGlow {
            0%, 100% { transform: scale(1); filter: drop-shadow(0 0 8px rgba(16, 185, 129, 0.5)); }
            50% { transform: scale(1.04); filter: drop-shadow(0 0 15px rgba(16, 185, 129, 0.8)); }
        }
        .animate-breathing { animation: breathingGlow 3s infinite ease-in-out; }

        .glass-panel {
            background: rgba(255, 255, 255, 0.9);
            backdrop-filter: blur(20px);
            -webkit-backdrop-filter: blur(20px);
            border: 1px solid rgba(255, 255, 255, 0.6);
        }
        .dark .glass-panel {
            background: rgba(15, 23, 42, 0.85);
            backdrop-filter: blur(20px);
            -webkit-backdrop-filter: blur(20px);
            border: 1px solid rgba(255, 255, 255, 0.08);
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.4);
        }
        
        .card-active {
            border-color: rgba(16, 185, 129, 0.6) !important;
            box-shadow: 0 10px 25px -5px rgba(16, 185, 129, 0.25) !important;
        }
    </style>
</head>
<body class="bg-slate-100 dark:bg-slate-950 min-h-screen text-slate-800 dark:text-slate-100 p-3 sm:p-6 transition-colors duration-300 relative overflow-x-hidden">

    <!-- Canvas Partikel (Hanya aktif di Desktop untuk performa HP) -->
    <canvas id="particleCanvas"></canvas>

    <div class="max-w-6xl mx-auto space-y-4 relative z-10">
        
        <!-- Header Utama & Kontrol Global -->
        <div class="glass-panel p-4 sm:p-6 md:p-8 rounded-3xl flex flex-col gap-4 shadow-xl">
            
            <div class="flex flex-col sm:flex-row justify-between items-start sm:items-center gap-4">
                <div class="flex items-center gap-3">
                    <div class="w-12 h-12 sm:w-14 sm:h-14 rounded-2xl bg-gradient-to-tr from-indigo-600 to-violet-600 flex items-center justify-center text-white shadow-lg shadow-indigo-500/25 shrink-0">
                        <i class="fa-solid fa-house-signal text-lg sm:text-xl"></i>
                    </div>
                    <div>
                        <span class="inline-flex items-center gap-1 bg-indigo-500/10 text-indigo-600 dark:text-indigo-400 text-[10px] font-extrabold px-2.5 py-0.5 rounded-full uppercase tracking-wider border border-indigo-500/20">
                            <i class="fa-solid fa-bolt text-[8px]"></i> HiveMQ Cloud Pro
                        </span>
                        <h1 class="text-lg sm:text-2xl font-extrabold mt-1 text-slate-900 dark:text-white tracking-tight">Smart Home Automation</h1>
                    </div>
                </div>

                <!-- Jam & Toggle Tema -->
                <div class="flex items-center justify-between sm:justify-end w-full sm:w-auto gap-3 border-t sm:border-t-0 pt-2 sm:pt-0 border-slate-200 dark:border-white/10">
                    <div class="text-left sm:text-right">
                        <div id="liveClock" class="text-base sm:text-lg font-extrabold font-mono text-indigo-600 dark:text-indigo-400">00:00:00</div>
                        <div id="liveDate" class="text-[10px] text-slate-500 dark:text-slate-400 font-semibold">Memuat...</div>
                    </div>
                    <button onclick="playClickSound(); toggleTheme()" class="w-10 h-10 rounded-xl bg-slate-200/80 dark:bg-white/10 border border-slate-300/50 dark:border-white/10 flex items-center justify-center text-slate-700 dark:text-yellow-400 active:scale-95 transition-all shrink-0">
                        <i id="themeIcon" class="fa-solid fa-moon text-sm"></i>
                    </button>
                </div>
            </div>

            <!-- Tombol Master & Bar Status -->
            <div class="grid grid-cols-2 sm:grid-cols-4 lg:flex lg:flex-wrap items-center gap-2 pt-2 border-t border-slate-200/80 dark:border-white/10">
                <button onclick="playClickSound(); kirimGlobal('1')" class="bg-emerald-600 hover:bg-emerald-500 active:scale-95 text-white font-bold py-2 px-3 rounded-xl text-[11px] shadow transition-all flex items-center justify-center gap-1.5">
                    <i class="fa-solid fa-power-off"></i> Nyalakan Semua
                </button>
                <button onclick="playClickSound(); kirimGlobal('0')" class="bg-rose-600 hover:bg-rose-500 active:scale-95 text-white font-bold py-2 px-3 rounded-xl text-[11px] shadow transition-all flex items-center justify-center gap-1.5">
                    <i class="fa-solid fa-ban"></i> Matikan Semua
                </button>

                <div class="bg-slate-200/60 dark:bg-slate-900/80 px-3 py-1.5 rounded-xl flex items-center space-x-2 border border-slate-300/40 dark:border-white/5 flex-1 min-w-[100px]">
                    <div class="text-indigo-500 text-xs"><i id="wifiIcon" class="fa-solid fa-wifi-slash"></i></div>
                    <div>
                        <div class="text-[8px] text-slate-400 font-bold uppercase">WiFi</div>
                        <span id="wifiRssi" class="font-bold text-[11px] font-mono">-- dBm</span>
                    </div>
                </div>

                <div class="bg-slate-200/60 dark:bg-slate-900/80 px-3 py-1.5 rounded-xl flex items-center space-x-2 border border-slate-300/40 dark:border-white/5 flex-1 min-w-[90px]">
                    <div class="w-2 h-2 rounded-full bg-amber-500 animate-pulse shrink-0"></div>
                    <div>
                        <div class="text-[8px] text-slate-400 font-bold uppercase">Daya</div>
                        <span id="powerUsage" class="font-bold text-[11px] text-amber-500 font-mono">0 W</span>
                    </div>
                </div>

                <div class="bg-slate-200/60 dark:bg-slate-900/80 px-3 py-1.5 rounded-xl flex items-center space-x-2 border border-slate-300/40 dark:border-white/5 flex-1 min-w-[90px]">
                    <div class="w-2 h-2 rounded-full bg-emerald-500 shrink-0"></div>
                    <div>
                        <div class="text-[8px] text-slate-400 font-bold uppercase">Aktif</div>
                        <span id="activeCount" class="font-bold text-[11px] font-mono">0 / 6</span>
                    </div>
                </div>

                <div class="bg-slate-200/60 dark:bg-slate-900/80 px-3 py-1.5 rounded-xl flex items-center space-x-2 border border-slate-300/40 dark:border-white/5 flex-1 min-w-[90px]">
                    <div id="espDot" class="w-2.5 h-2.5 rounded-full bg-rose-500 shrink-0"></div>
                    <div>
                        <div class="text-[8px] text-slate-400 font-bold uppercase">ESP32</div>
                        <span id="espStatus" class="font-bold text-[11px] text-rose-500 uppercase">Offline</span>
                    </div>
                </div>
            </div>

        </div>

        <!-- Grid 6 Kartu Lampu -->
        <div class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-4" id="lampuGrid"></div>

        <!-- Footer Info Broker -->
        <p id="brokerStatus" class="text-[11px] text-slate-500 dark:text-slate-400 text-center font-mono py-1">Menghubungkan ke broker...</p>
    </div>

    <!-- Skrip Ringan & Optimal -->
    <script>
        // Deteksi Perangkat HP: Matikan partikel jika lebar layar < 768px agar tidak ngeleg
        const isMobile = window.innerWidth < 768;
        const canvas = document.getElementById('particleCanvas');
        let particlesArray = [];

        if (!isMobile) {
            const ctx = canvas.getContext('2d');
            let mouse = { x: null, y: null, radius: 100 };
            window.addEventListener('mousemove', (e) => { mouse.x = e.clientX; mouse.y = e.clientY; });
            function resizeCanvas() { canvas.width = window.innerWidth; canvas.height = window.innerHeight; }
            window.addEventListener('resize', resizeCanvas);
            resizeCanvas();

            class Particle {
                constructor() {
                    this.x = Math.random() * canvas.width;
                    this.y = Math.random() * canvas.height;
                    this.size = Math.random() * 1.5 + 1;
                    this.vx = (Math.random() - 0.5) * 0.4;
                    this.vy = (Math.random() - 0.5) * 0.4;
                }
                update() {
                    this.x += this.vx; this.y += this.vy;
                    if (this.x < 0 || this.x > canvas.width) this.vx = -this.vx;
                    if (this.y < 0 || this.y > canvas.height) this.vy = -this.vy;
                }
                draw() {
                    ctx.fillStyle = 'rgba(129, 140, 248, 0.25)';
                    ctx.beginPath(); ctx.arc(this.x, this.y, this.size, 0, Math.PI * 2); ctx.fill();
                }
            }
            for (let i = 0; i < 30; i++) particlesArray.push(new Particle()); // Batasi jumlah partikel ringan
            function animateParticles() {
                ctx.clearRect(0, 0, canvas.width, canvas.height);
                particlesArray.forEach(p => { p.update(); p.draw(); });
                requestAnimationFrame(animateParticles);
            }
            animateParticles();
        } else {
            canvas.style.display = 'none'; // Sembunyikan canvas total di HP agar CPU/GPU HP tidak terbebani
        }

        function playClickSound() {
            try {
                const audioCtx = new (window.AudioContext || window.webkitAudioContext)();
                const oscillator = audioCtx.createOscillator();
                const gainNode = audioCtx.createGain();
                oscillator.type = 'sine';
                oscillator.frequency.setValueAtTime(500, audioCtx.currentTime);
                gainNode.gain.setValueAtTime(0.1, audioCtx.currentTime);
                gainNode.gain.exponentialRampToValueAtTime(0.01, audioCtx.currentTime + 0.03);
                oscillator.connect(gainNode); gainNode.connect(audioCtx.destination);
                oscillator.start(); oscillator.stop(audioCtx.currentTime + 0.03);
            } catch (e) {}
        }

        function toggleTheme() {
            const html = document.documentElement;
            const themeIcon = document.getElementById('themeIcon');
            if (html.classList.contains('dark')) {
                html.classList.remove('dark'); localStorage.setItem('theme', 'light');
                themeIcon.className = "fa-solid fa-sun text-sm text-amber-500";
            } else {
                html.classList.add('dark'); localStorage.setItem('theme', 'dark');
                themeIcon.className = "fa-solid fa-moon text-sm text-yellow-400";
            }
        }

        (function() {
            if (localStorage.getItem('theme') === 'light') {
                document.documentElement.classList.remove('dark');
                document.getElementById('themeIcon').className = "fa-solid fa-sun text-sm text-amber-500";
            }
        })();

        const mqttHost = "2908953d76114d82ae11bce6b3817745.s1.eu.hivemq.cloud";
        const mqttPort = 8884; 
        const mqttStatusTopic = "esp32s3/status/galang";
        const mqttRssiTopic = "esp32s3/rssi/galang";
        
        const lampuList = [
            { id: 1, nama: "Lampu 1 (Utama)", topik: "esp32s3/lampu1/galang", icon: "fa-lightbulb", watt: 10 },
            { id: 2, nama: "Lampu 2 (Kamar)", topik: "esp32s3/lampu2/galang", icon: "fa-bed", watt: 10 },
            { id: 3, nama: "Lampu 3 (Dapur)", topik: "esp32s3/lampu3/galang", icon: "fa-kitchen-set", watt: 15 },
            { id: 4, nama: "Lampu 4 (Teras)", topik: "esp32s3/lampu4/galang", icon: "fa-door-open", watt: 15 },
            { id: 5, nama: "Lampu 5 (K. Mandi)", topik: "esp32s3/lampu5/galang", icon: "fa-bath", watt: 10 },
            { id: 6, nama: "Lampu 6 (Gudang)", topik: "esp32s3/lampu6/galang", icon: "fa-box-archive", watt: 10 }
        ];

        let stateLampu = {};
        let timerIntervals = {};
        let jadwalStates = {};

        const container = document.getElementById('lampuGrid');
        lampuList.forEach(lampu => {
            stateLampu[lampu.topik] = '0';
            jadwalStates[lampu.topik] = false;

            container.innerHTML += `
                <div id="card_${lampu.id}" class="glass-panel p-4 rounded-3xl space-y-3 shadow-lg border border-slate-200/80 dark:border-white/10 relative overflow-hidden">
                    <div class="flex justify-between items-center">
                        <div class="flex items-center gap-3">
                            <div id="iconBox_${lampu.id}" class="w-10 h-10 rounded-xl bg-slate-200/80 dark:bg-slate-800/80 flex items-center justify-center text-slate-600 dark:text-slate-400 shadow-inner shrink-0">
                                <i class="fa-solid ${lampu.icon} text-sm"></i>
                            </div>
                            <div>
                                <h3 class="font-extrabold text-xs text-slate-900 dark:text-white">${lampu.nama}</h3>
                                <p class="text-[10px] text-slate-500">${lampu.watt} Watt</p>
                            </div>
                        </div>
                        <div class="flex items-center space-x-1.5 bg-slate-200/70 dark:bg-slate-900/80 px-2.5 py-1 rounded-xl">
                            <div id="dot_${lampu.id}" class="w-2 h-2 rounded-full bg-slate-400"></div>
                            <span id="text_${lampu.id}" class="font-extrabold text-[10px] text-slate-500 uppercase">MATI</span>
                        </div>
                    </div>

                    <div class="grid grid-cols-2 gap-2 pt-1">
                        <button id="btnNyala_${lampu.id}" onclick="playClickSound(); kirimMQTT('${lampu.topik}', '1')" class="bg-emerald-600 hover:bg-emerald-500 active:scale-95 text-white font-bold py-2.5 px-2 rounded-xl text-[11px] shadow flex items-center justify-center gap-1.5">
                            <i class="fa-solid fa-power-off text-emerald-200"></i> NYALA
                        </button>
                        <button id="btnMati_${lampu.id}" onclick="playClickSound(); kirimMQTT('${lampu.topik}', '0')" class="bg-rose-600 hover:bg-rose-500 active:scale-95 text-white font-bold py-2.5 px-2 rounded-xl text-[11px] shadow flex items-center justify-center gap-1.5">
                            <i class="fa-solid fa-ban text-rose-200"></i> MATI
                        </button>
                    </div>

                    <div class="bg-slate-200/40 dark:bg-slate-900/40 p-3 rounded-xl space-y-1.5">
                        <span class="text-[9px] font-extrabold text-indigo-500 uppercase">Timer (Detik)</span>
                        <div class="flex gap-2">
                            <input type="number" id="timerSec_${lampu.id}" min="1" value="10" class="w-full p-2 rounded-lg text-center bg-white dark:bg-slate-900 border border-slate-300 dark:border-slate-700 font-mono text-xs">
                            <button onclick="playClickSound(); mulaiTimer(${lampu.id}, '${lampu.topik}')" class="bg-indigo-600 active:scale-95 text-white px-3 py-2 rounded-lg text-xs font-bold shrink-0">Mulai</button>
                        </div>
                        <div id="timerInfo_${lampu.id}" class="text-[10px] text-center text-slate-400 font-mono">Nonaktif</div>
                    </div>

                    <div class="bg-slate-200/40 dark:bg-slate-900/40 p-3 rounded-xl space-y-1.5">
                        <span class="text-[9px] font-extrabold text-indigo-500 uppercase">Jadwal</span>
                        <div class="grid grid-cols-2 gap-1.5">
                            <input type="time" id="mulai_${lampu.id}" class="p-1.5 rounded-lg bg-white dark:bg-slate-900 border border-slate-300 dark:border-slate-700 text-center text-xs font-mono">
                            <input type="time" id="selesai_${lampu.id}" class="p-1.5 rounded-lg bg-white dark:bg-slate-900 border border-slate-300 dark:border-slate-700 text-center text-xs font-mono">
                        </div>
                        <div class="flex gap-1.5 pt-1">
                            <button onclick="playClickSound(); aktifkanJadwal(${lampu.id}, '${lampu.topik}')" class="flex-1 bg-emerald-600 active:scale-95 text-white py-1.5 rounded-lg text-[10px] font-bold">Aktif</button>
                            <button onclick="playClickSound(); matikanJadwal(${lampu.id})" class="flex-1 bg-rose-600 active:scale-95 text-white py-1.5 rounded-lg text-[10px] font-bold">Mati</button>
                        </div>
                        <div id="jadwalInfo_${lampu.id}" class="text-[10px] text-center text-slate-400 font-mono">Nonaktif</div>
                    </div>
                </div>
            `;
        });

        const mqttOptions = {
            clientId: "WebClient_" + Math.random().toString(16).substr(2, 8),
            username: "galanglinduaji", password: "galangganteng", protocol: "wss"
        };

        const client = mqtt.connect(`wss://${mqttHost}:${mqttPort}/mqtt`, mqttOptions);
        let espTimeout = null;

        function updateStatsAndPower() {
            let activeCount = 0, totalWatt = 0;
            lampuList.forEach(l => {
                if (stateLampu[l.topik] === '1') { activeCount++; totalWatt += l.watt; }
            });
            document.getElementById('activeCount').innerText = `${activeCount} / 6`;
            document.getElementById('powerUsage').innerText = `${totalWatt} W`;
        }

        function kirimGlobal(nilai) {
            lampuList.forEach(l => { if (!jadwalStates[l.topik]) client.publish(l.topik, nilai); });
        }

        client.on("connect", () => {
            document.getElementById("brokerStatus").innerText = "Status: Terhubung ke MQTT Cloud (WSS)";
            client.subscribe(mqttStatusTopic); client.subscribe(mqttRssiTopic);
            lampuList.forEach(l => client.subscribe(l.topik));
        });

        client.on("message", (topic, payload) => {
            let message = payload.toString();
            if (topic === mqttStatusTopic && message === "ONLINE") {
                let espDot = document.getElementById('espDot');
                let espStatus = document.getElementById('espStatus');
                espDot.className = "w-2.5 h-2.5 rounded-full bg-emerald-500 shrink-0";
                espStatus.innerText = "Online"; espStatus.className = "font-bold text-[11px] text-emerald-500 uppercase";
                clearTimeout(espTimeout);
                espTimeout = setTimeout(() => {
                    document.getElementById('espDot').className = "w-2.5 h-2.5 rounded-full bg-rose-500 shrink-0";
                    document.getElementById('espStatus').innerText = "Offline";
                    document.getElementById('espStatus').className = "font-bold text-[11px] text-rose-500 uppercase";
                }, 15000);
            }

            if (topic === mqttRssiTopic) {
                let rssiVal = parseInt(message);
                document.getElementById('wifiRssi').innerText = `${rssiVal} dBm`;
                document.getElementById('wifiIcon').className = `fa-solid fa-wifi ${rssiVal >= -60 ? 'text-emerald-500' : rssiVal >= -80 ? 'text-amber-500' : 'text-rose-500'}`;
            }

            lampuList.forEach(l => {
                if (topic === l.topik) {
                    stateLampu[l.topik] = message;
                    let textSpan = document.getElementById(`text_${l.id}`), dotDiv = document.getElementById(`dot_${l.id}`), iconBox = document.getElementById(`iconBox_${l.id}`), card = document.getElementById(`card_${l.id}`);
                    if (message === '1') {
                        textSpan.innerText = 'NYALA'; textSpan.className = 'font-extrabold text-[10px] text-emerald-500 uppercase';
                        dotDiv.className = 'w-2 h-2 rounded-full bg-emerald-500 animate-breathing';
                        iconBox.className = "w-10 h-10 rounded-xl bg-gradient-to-tr from-emerald-500 to-teal-400 flex items-center justify-center text-white shadow-md shadow-emerald-500/40 shrink-0 animate-breathing";
                        card.classList.add('card-active');
                    } else {
                        textSpan.innerText = 'MATI'; textSpan.className = 'font-extrabold text-[10px] text-slate-400 uppercase';
                        dotDiv.className = 'w-2 h-2 rounded-full bg-slate-400';
                        iconBox.className = "w-10 h-10 rounded-xl bg-slate-200/80 dark:bg-slate-800/80 flex items-center justify-center text-slate-600 dark:text-slate-400 shadow-inner shrink-0";
                        card.classList.remove('card-active');
                    }
                }
            });
            updateStatsAndPower();
        });

        function updateClock() {
            const now = new Date();
            document.getElementById('liveClock').innerText = now.toTimeString().split(' ')[0];
            document.getElementById('liveDate').innerText = now.toLocaleDateString('id-ID', { weekday: 'short', day: 'numeric', month: 'short' });
            lampuList.forEach(l => { if (jadwalStates[l.topik]) cekRentangJadwal(l.id, l.topik, now.getHours(), now.getMinutes()); });
        }
        setInterval(updateClock, 1000);

        function mulaiTimer(id, topik) {
            if (jadwalStates[topik]) return alert("Jadwal aktif!");
            if (timerIntervals[id]) clearInterval(timerIntervals[id]);
            let detik = parseInt(document.getElementById(`timerSec_${id}`).value) || 10;
            client.publish(topik, '1');
            timerIntervals[id] = setInterval(() => {
                if (detik > 0) {
                    detik--; document.getElementById(`timerInfo_${id}`).innerText = `Sisa: ${detik}s`;
                } else {
                    clearInterval(timerIntervals[id]); client.publish(topik, '0');
                    document.getElementById(`timerInfo_${id}`).innerText = "Selesai";
                }
            }, 1000);
        }

        function aktifkanJadwal(id, topik) {
            const mulai = document.getElementById(`mulai_${id}`).value, selesai = document.getElementById(`selesai_${id}`).value;
            if (!mulai || !selesai) return alert("Atur jam mulai & selesai!");
            jadwalStates[topik] = true;
            document.getElementById(`jadwalInfo_${id}`).innerText = `Aktif (${mulai}-${selesai})`;
        }

        function matikanJadwal(id) {
            jadwalStates[lampuList.find(l => l.id === id).topik] = false;
            document.getElementById(`jadwalInfo_${id}`).innerText = "Nonaktif";
        }

        function cekRentangJadwal(id, topik, jam, menit) {
            const m = document.getElementById(`mulai_${id}`).value.split(':').map(Number);
            const s = document.getElementById(`selesai_${id}`).value.split(':').map(Number);
            if (!m.length || !s.length) return;
            const nowMin = (jam * 60) + menit;
            client.publish(topik, (nowMin >= (m[0]*60+m[1]) && nowMin < (s[0]*60+s[1])) ? '1' : '0');
        }
    </script>
</body>
</html>
