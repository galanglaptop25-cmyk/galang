<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Smart Home - Secure MQTT Control</title>
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- HiveMQ MQTT Client Library -->
    <script src="https://unpkg.com/mqtt@4.3.7/dist/mqtt.min.js"></script>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Inter:wght@300;400;600;700&display=swap');
        body { font-family: 'Inter', sans-serif; }
    </style>
</head>
<body class="bg-gradient-to-br from-slate-900 via-indigo-950 to-slate-900 min-h-screen flex items-center justify-center p-4">

    <div class="bg-white/10 backdrop-blur-lg border border-white/20 p-8 rounded-3xl shadow-2xl max-w-md w-full text-center text-white">
        
        <!-- Header -->
        <div class="mb-6">
            <span class="bg-purple-500/30 text-purple-300 text-xs font-semibold px-3 py-1 rounded-full uppercase tracking-wider border border-purple-500/30">Secure MQTT</span>
            <h1 class="text-2xl font-bold mt-3">Kontrol Lampu IoT</h1>
            <p class="text-slate-400 text-sm mt-1">Autentikasi Username & Password</p>
        </div>

        <!-- Indikator Status -->
        <div class="bg-slate-900/50 border border-slate-700/50 p-5 rounded-2xl mb-8 flex items-center justify-between shadow-inner">
            <div class="flex items-center space-x-3">
                <div id="statusDot" class="w-4 h-4 rounded-full bg-gray-500 animate-pulse"></div>
                <span class="text-slate-300 text-sm font-medium">Status Perangkat</span>
            </div>
            <span id="statusText" class="font-bold text-lg text-gray-400">Menghubungkan...</span>
        </div>

        <!-- Tombol Kontrol -->
        <div class="grid grid-cols-2 gap-4">
            <button onclick="kirimMQTT('1')" class="group relative overflow-hidden bg-emerald-600 hover:bg-emerald-500 text-white font-semibold py-4 px-6 rounded-2xl transition-all duration-300 shadow-lg shadow-emerald-900/30 active:scale-95 flex flex-col items-center justify-center space-y-1">
                <svg class="w-6 h-6 mb-1 text-emerald-200 group-hover:scale-110 transition-transform" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M13 10V3L4 14h7v7l9-11h-7z"/></svg>
                <span>NYALAKAN</span>
            </button>

            <button onclick="kirimMQTT('0')" class="group relative overflow-hidden bg-rose-600 hover:bg-rose-500 text-white font-semibold py-4 px-6 rounded-2xl transition-all duration-300 shadow-lg shadow-rose-900/30 active:scale-95 flex flex-col items-center justify-center space-y-1">
                <svg class="w-6 h-6 mb-1 text-rose-200 group-hover:scale-110 transition-transform" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M18.364 5.636l-12.728 12.728M5.636 5.636l12.728 12.728"/></svg>
                <span>MATIKAN</span>
            </button>
        </div>

        <!-- Footer Info -->
        <p id="brokerStatus" class="text-xs text-slate-500 mt-8">Menghubungkan ke broker...</p>
    </div>

    <!-- Skrip MQTT dengan Auth -->
    <script>
        const mqttHost = "2908953d76114d82ae11bce6b3817745.s1.eu.hivemq.cloud";
        const mqttPort = 8884; // Port WebSockets Secure HiveMQ Cloud
        const mqttTopic = "esp32s3/lampu/galang";
        
        const mqttOptions = {
            clientId: "WebClient_" + Math.random().toString(16).substr(2, 8),
            username: "galanglinduaji", // Ganti dengan username HiveMQ Cloud Anda
            password: "galangganteng", // Ganti dengan password HiveMQ Cloud Anda
            protocol: "wss"
        };

        const brokerUrl = `wss://${mqttHost}:${mqttPort}/mqtt`;
        const client = mqtt.connect(brokerUrl, mqttOptions);

        client.on("connect", () => {
            console.log("Terhubung ke HiveMQ Cloud!");
            document.getElementById("brokerStatus").innerText = "Status: Terhubung (Cloud Aman)";
            client.subscribe(mqttTopic);
        });

        client.on("error", (err) => {
            console.error("Koneksi MQTT Gagal: ", err);
            document.getElementById("brokerStatus").innerText = "Status: Gagal Terhubung";
        });

        client.on("message", (topic, payload) => {
            let status = payload.toString();
            let textSpan = document.getElementById('statusText');
            let dotDiv = document.getElementById('statusDot');
            
            if (status === '1') {
                textSpan.innerText = 'MENYALA';
                textSpan.className = 'font-bold text-lg text-emerald-400 drop-shadow-[0_0_8px_rgba(52,211,153,0.5)]';
                dotDiv.className = 'w-4 h-4 rounded-full bg-emerald-500 shadow-[0_0_12px_#10b981] animate-none';
            } else {
                textSpan.innerText = 'MATI';
                textSpan.className = 'font-bold text-lg text-rose-400';
                dotDiv.className = 'w-4 h-4 rounded-full bg-rose-500 animate-pulse';
            }
        });

        function kirimMQTT(nilai) {
            client.publish(mqttTopic, nilai, () => {
                console.log("Pesan terkirim:", nilai);
            });
        }
    </script>
</body>
</html>
